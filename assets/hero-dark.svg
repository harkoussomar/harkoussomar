<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Omar Harkouss — Full-Stack Engineer</title>
  <desc id="desc">GitHub profile identity banner with a subtle git branch graph.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58A6FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#21262D" stroke-width="1"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="26" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="418" rx="26" fill="url(#fade)"/>

  <!-- quiet grid / visual field -->
  <rect x="742" y="28" width="420" height="364" rx="20" fill="url(#grid)" opacity=".76"/>
  <circle cx="952" cy="210" r="174" fill="url(#orb)" filter="url(#soft)"/>

  <!-- repository identity -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="52" y="48" width="238" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <circle cx="72" cy="65" r="5" fill="#3FB950"/>
    <text x="88" y="70" font-size="13" font-weight="600" fill="#8B949E" letter-spacing=".8">HARKOUSSOMAR / PROFILE</text>

    <rect x="304" y="48" width="82" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <text x="328" y="70" font-size="13" font-weight="700" fill="#3FB950">main</text>
  </g>

  <!-- primary identity -->
  <text x="52" y="172" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="62" font-weight="760" fill="#F0F6FC" letter-spacing="-2.4">OMAR HARKOUSS</text>
  <text x="55" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="16" font-weight="700" fill="#58A6FF" letter-spacing="2.2">FULL-STACK ENGINEER / PRODUCT SYSTEMS</text>

  <text x="55" y="264" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" fill="#8B949E">I build software end to end — architecture, product, data, security, and AI.</text>

  <!-- stack line -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
    <rect x="52" y="304" width="108" height="34" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="75" y="326" fill="#F0F6FC">Next.js</text>
    <rect x="170" y="304" width="120" height="34" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="188" y="326" fill="#F0F6FC">TypeScript</text>
    <rect x="300" y="304" width="76" height="34" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="321" y="326" fill="#F0F6FC">Java</text>
    <rect x="386" y="304" width="132" height="34" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="405" y="326" fill="#F0F6FC">Spring Boot</text>
    <rect x="528" y="304" width="128" height="34" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="548" y="326" fill="#F0F6FC">PostgreSQL</text>
  </g>

  <text x="54" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="12" fill="#8B949E" letter-spacing=".7">github.com/harkoussomar</text>

  <!-- git graph -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M812 92V330" stroke="#30363D" stroke-width="3"/>
    <path d="M812 166 C860 166 868 128 912 128 H1014 C1052 128 1064 154 1064 188 V220 C1064 254 1044 272 1010 272 H936 C886 272 870 304 812 304"
          stroke="#58A6FF" stroke-width="3"/>
    <path d="M812 220 C858 220 866 246 902 246" stroke="#3FB950" stroke-width="3"/>

    <circle cx="812" cy="112" r="8" fill="#0D1117" stroke="#3FB950" stroke-width="4"/>
    <circle cx="812" cy="166" r="8" fill="#0D1117" stroke="#58A6FF" stroke-width="4"/>
    <circle cx="812" cy="220" r="8" fill="#0D1117" stroke="#3FB950" stroke-width="4"/>
    <circle cx="812" cy="304" r="8" fill="#0D1117" stroke="#58A6FF" stroke-width="4"/>
    <circle cx="912" cy="128" r="8" fill="#0D1117" stroke="#58A6FF" stroke-width="4"/>
    <circle cx="1064" cy="220" r="8" fill="#0D1117" stroke="#58A6FF" stroke-width="4"/>
    <circle cx="902" cy="246" r="8" fill="#0D1117" stroke="#3FB950" stroke-width="4"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="838" y="116" font-size="12" font-weight="700" fill="#3FB950">HEAD / main</text>
    <text x="935" y="109" font-size="11" fill="#8B949E">feature / product</text>
    <text x="930" y="151" font-size="12" font-weight="700" fill="#F0F6FC">ship systems</text>
    <text x="926" y="240" font-size="11" fill="#8B949E">security / ownership</text>
    <text x="922" y="292" font-size="12" font-weight="700" fill="#F0F6FC">merge / production</text>
  </g>
</svg>